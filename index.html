<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibemessanger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen">
    <div class="auth-card" id="login-form">
      <h1>Vibemessanger</h1>
      <p class="subtitle">Вход</p>
      <input id="login-email" type="email" placeholder="Email" required>
      <input id="login-password" type="password" placeholder="Пароль" required>
      <button id="btn-login">Войти</button>
      <p class="switch-link" onclick="toggleAuth('register')">Нет аккаунта? Зарегистрироваться</p>
      <div id="login-error" class="error-msg"></div>
    </div>
    <div class="auth-card hidden" id="register-form">
      <h1>Vibemessanger</h1>
      <p class="subtitle">Регистрация</p>
      <input id="reg-email" type="email" placeholder="Email" required>
      <input id="reg-username" type="text" placeholder="Ник" maxlength="20" required>
      <input id="reg-password" type="password" placeholder="Пароль (мин 6)" required>
      <button id="btn-register">Зарегистрироваться</button>
      <p class="switch-link" onclick="toggleAuth('login')">Уже есть аккаунт? Войти</p>
      <div id="register-error" class="error-msg"></div>
    </div>
        <div class="auth-card hidden" id="verify-form">
      <h1>Vibemessanger</h1>
      <p class="subtitle">Проверка почты</p>
      <p class="info-msg">Мы отправили код подтверждения на твой email.</p>
      <div class="input-group">
        <input id="verify-code" type="text" placeholder="Код" maxlength="8" style="text-align: center; font-size: 24px; letter-spacing: 12px; font-weight: bold;" required autocomplete="off">
      </div>
      <button id="btn-verify" class="btn-primary" style="margin-top: 15px;">Подтвердить</button>
      <p class="switch-link" onclick="toggleAuth('login')">Отмена</p>
      <div id="verify-error" class="error-msg"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="my-avatar"></div>
        <div class="sidebar-info">
          <div id="me"></div>
          <div class="status">в сети</div>
        </div>
        <button id="logout-btn" title="Выйти">×</button>
      </div>
      <div class="search-box">
        <input id="search" placeholder="Поиск...">
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="chats">Чаты</button>
        <button class="tab" data-tab="requests">Заявки <span id="req-count" class="req-badge"></span></button>
        <button class="tab" data-tab="people">Люди</button>
      </div>
      <ul id="list"></ul>
    </aside>

    <main id="chat">
      <div id="chat-header">
        <button id="back-btn" title="Назад">←</button>
        <div class="avatar" id="chat-avatar" style="display:none"></div>
        <div class="chat-header-info">
          <div id="chat-header-name">Выбери собеседника</div>
          <div id="chat-header-status"></div>
        </div>
      </div>
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="Написать сообщение..." autocomplete="off">
        <button type="submit" title="Отправить">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="client.js"></script>
</body>
</html>
