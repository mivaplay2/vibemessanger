<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="login">
    <h1>Мессенджер</h1>
    <input id="username" placeholder="Твой ник" maxlength="20" required>
    <button type="submit">Войти</button>
  </form>

  <div id="app" style="display:none">
    <aside id="sidebar">
      <div id="me"></div>
      <h3>Онлайн</h3>
      <ul id="users"></ul>
    </aside>
    <main id="chat">
      <div id="chat-header">Выбери собеседника</div>
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="Сообщение..." autocomplete="off">
        <button type="submit">Отправить</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
